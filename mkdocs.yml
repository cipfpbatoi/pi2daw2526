site_name: Projecte Intermodular 2DAW
site_url: https://cipfpbatoi.github.io/pi2627/
use_directory_urls: false

nav:
  - "Planificació del curs": "planning.md"
  - "Bloc 1. Reactivació":
      - "Guia de l'alumnat": "bloc1-alumnat.md"
      - "Material de consulta": "bloc1-consulta.md"
      - "Sessió 1. Del problema al projecte": "bloc1-sessio1.md"
      - "Sessió 2. De l'abast al pla": "bloc1-sessio2.md"
      - "Sessió 3. Preparar-se per executar": "bloc1-sessio3.md"
      - "Plantilla del Dossier 0": "bloc1-dossier0.md"
      - "Guia del professorat": "bloc1-professorat.md"
theme:
  language: ca
  favicon: imagenes/favicon.png
  name: "material"
  palette:
    - scheme: default
      primary: light blue
      accent: "Teal"
      toggle:
        icon: material/toggle-switch-off-outline
        name: Canviar a mode nit
    - scheme: slate 
      primary: light blue
      accent: "Teal"
      toggle:
        icon: material/toggle-switch
        name: Canviar a mode dia
  font:
    text: Roboto
    code: Roboto Mono
  logo: "imagenes/logofp.png"
  features:
    - header.autohide
    - toc.integrate
    - content.tabs.link
    # - navigation.tabs
    # - navigation.top

extra:
  search:
    language: "ca"
  social:
    - icon: material/twitter
      link: https://twitter.com/aitormedrano
    - icon: material/email-edit
      link: mailto:<i.gomismullor@edu.gva.es>
  analytics:
    provider: google
    property: G-X6D0LR7TC8

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.superfences:
      custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - footnotes
  - meta
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 3

